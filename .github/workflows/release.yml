name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Notify Telegram — release published
        uses: ./
        with:
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: success
          stage: Release
          extra: "<b>Tag:</b> <code>${{ github.event.release.tag_name }}</code>%0A<b>Name:</b> ${{ github.event.release.name }}%0A<b>URL:</b> ${{ github.event.release.html_url }}"
