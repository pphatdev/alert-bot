name: "Telegram Bot Alert Action"
description: "Send build, deploy, release, and CI status alerts to Telegram, with a PR-comment fallback."
author: "pphatdev"
branding:
  icon: "send"
  color: "blue"

inputs:
  telegram-bot-token:
    description: "Telegram bot token from @BotFather. If empty, Telegram send is skipped and the alert falls back to a PR comment when the event is a pull_request."
    required: false
    default: ""
  telegram-chat-id:
    description: "Target chat ID (user or group, e.g. -1001234567890). If empty, Telegram send is skipped and the alert falls back to a PR comment when the event is a pull_request."
    required: false
    default: ""
  status:
    description: "success | failure | cancelled | started"
    required: true
  stage:
    description: "Build, Deploy, Release, Test, etc."
    required: true
  environment:
    description: "production, staging, preview (optional)"
    required: false
    default: ""
  extra:
    description: "Extra HTML line appended to the message (optional). Use \\n for newlines."
    required: false
    default: ""
  disable-notification:
    description: "If 'true', send a silent Telegram message"
    required: false
    default: "false"
  github-token:
    description: "Token used to post the PR-comment fallback when Telegram credentials are absent. Caller workflow must grant pull-requests: write."
    required: false
    default: ${{ github.token }}

outputs:
  message-id:
    description: "The Telegram message_id of the sent alert (empty when Telegram was skipped)"
    value: ${{ steps.send.outputs.message-id }}
  comment-id:
    description: "The GitHub PR comment id when the fallback comment was posted (empty otherwise)"
    value: ${{ steps.send.outputs.comment-id }}
  channel:
    description: "Which channel received the alert: 'telegram', 'pr-comment', or 'none'"
    value: ${{ steps.send.outputs.channel }}
  message:
    description: "The rendered alert message (HTML when delivered to Telegram, Markdown when delivered to a PR comment)"
    value: ${{ steps.send.outputs.message }}

runs:
  using: "composite"
  steps:
    - id: send
      shell: bash
      env:
        BOT_TOKEN: ${{ inputs.telegram-bot-token }}
        CHAT_ID: ${{ inputs.telegram-chat-id }}
        STATUS: ${{ inputs.status }}
        STAGE: ${{ inputs.stage }}
        ENVIRONMENT: ${{ inputs.environment }}
        EXTRA: ${{ inputs.extra }}
        SILENT: ${{ inputs.disable-notification }}
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        BRANCH: ${{ github.ref_name }}
        ACTOR: ${{ github.actor }}
        SHA: ${{ github.sha }}
        RUN_ID: ${{ github.run_id }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        ACTOR_URL: ${{ github.server_url }}/${{ github.actor }}
        EVENT: ${{ github.event_name }}
        EVENT_PATH: ${{ github.event_path }}
        API_URL: ${{ github.api_url }}
      run: |
        set -euo pipefail

        # Belt-and-suspenders: register credentials as masked so they can never
        # appear in this job's logs, even if a downstream step echoes them.
        # Skip when empty — ::add-mask:: on an empty string emits a warning.
        [ -n "$BOT_TOKEN" ] && echo "::add-mask::${BOT_TOKEN}" || true
        [ -n "$CHAT_ID" ]   && echo "::add-mask::${CHAT_ID}"   || true

        case "$STATUS" in
          success)   ICON="✅"; TITLE="Succeeded"; TRAIL=" 🎉" ;;
          failure)   ICON="❌"; TITLE="Failed";    TRAIL=" 🛠️" ;;
          cancelled) ICON="⚪"; TITLE="Cancelled"; TRAIL="" ;;
          started)   ICON="🚀"; TITLE="Started";   TRAIL="" ;;
          *)         ICON="ℹ️"; TITLE="$STATUS";   TRAIL="" ;;
        esac

        SHORT_SHA="${SHA:0:7}"
        NL=$'\n'

        ACTOR="${ACTOR:-pphatdev}"
        ACTOR_URL="${ACTOR_URL:-https://github.com/${ACTOR}}"

        EXTRA_EXPANDED=""
        if [ -n "$EXTRA" ]; then
          # Interpret literal \n sequences in the user-supplied extra as real newlines.
          EXTRA_EXPANDED=$(printf '%b' "$EXTRA")
        fi

        # Multiline output helper (heredoc with a random delimiter).
        write_output() {
          local key="$1" value="$2" delim
          delim="EOF_$(uuidgen 2>/dev/null || echo "${RANDOM}${RANDOM}${RANDOM}")"
          {
            printf '%s<<%s\n' "$key" "$delim"
            printf '%s\n' "$value"
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"
        }

        # --- Route: Telegram when creds present, else PR-comment fallback. ---
        if [ -n "$BOT_TOKEN" ] && [ -n "$CHAT_ID" ]; then
          ENV_LINE=""
          if [ -n "$ENVIRONMENT" ]; then
            ENV_LINE="🌐 <b>Env:</b> <code>${ENVIRONMENT}</code>${NL}"
          fi
          EXTRA_LINE=""
          if [ -n "$EXTRA_EXPANDED" ]; then
            EXTRA_LINE="${NL}${EXTRA_EXPANDED}"
          fi

          TEXT="${ICON} <b>${STAGE} ${TITLE}</b>${TRAIL}${NL}${NL}"
          TEXT="${TEXT}📦 <b>Repo:</b> <code>${REPO}</code>${NL}"
          TEXT="${TEXT}🌿 <b>Branch:</b> <code>${BRANCH}</code>${NL}"
          TEXT="${TEXT}${ENV_LINE}"
          TEXT="${TEXT}👤 <b>Actor:</b> <a href=\"${ACTOR_URL}\">${ACTOR}</a>${NL}"
          TEXT="${TEXT}⚡ <b>Event:</b> ${EVENT}${NL}"
          TEXT="${TEXT}🔖 <b>Commit:</b> <a href=\"${COMMIT_URL}\">${SHORT_SHA}</a>${NL}"
          TEXT="${TEXT}🏃 <b>Run:</b> <a href=\"${RUN_URL}\">#${RUN_ID}</a>"
          TEXT="${TEXT}${EXTRA_LINE}"

          RESP=$(curl -sS -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            -d "disable_notification=${SILENT}" \
            --data-urlencode "text=${TEXT}")

          echo "$RESP"

          if ! echo "$RESP" | grep -q '"ok":true'; then
            echo "::error::Telegram API returned an error"
            exit 1
          fi

          MSG_ID=$(echo "$RESP" | sed -n 's/.*"message_id":\([0-9]*\).*/\1/p' | head -n1)
          echo "message-id=${MSG_ID}" >> "$GITHUB_OUTPUT"
          echo "channel=telegram" >> "$GITHUB_OUTPUT"
          write_output "message" "$TEXT"
          exit 0
        fi

        echo "::notice::Telegram credentials not provided — skipping Telegram send."

        # Convert HTML-formatted extra to Markdown so the fallback comment renders cleanly.
        EXTRA_MD=""
        if [ -n "$EXTRA_EXPANDED" ]; then
          EXTRA_MD=$(printf '%s' "$EXTRA_EXPANDED" \
            | sed -e 's|<b>|**|g' -e 's|</b>|**|g' \
                  -e 's|<i>|_|g'  -e 's|</i>|_|g' \
                  -e 's|<code>|`|g' -e 's|</code>|`|g')
        fi

        ENV_LINE_MD=""
        if [ -n "$ENVIRONMENT" ]; then
          ENV_LINE_MD="- 🌐 **Env:** \`${ENVIRONMENT}\`${NL}"
        fi
        EXTRA_LINE_MD=""
        if [ -n "$EXTRA_MD" ]; then
          EXTRA_LINE_MD="${NL}${EXTRA_MD}"
        fi

        TEXT_MD="### ${ICON} ${STAGE} ${TITLE}${TRAIL}${NL}${NL}"
        TEXT_MD="${TEXT_MD}- 📦 **Repo:** \`${REPO}\`${NL}"
        TEXT_MD="${TEXT_MD}- 🌿 **Branch:** \`${BRANCH}\`${NL}"
        TEXT_MD="${TEXT_MD}${ENV_LINE_MD}"
        TEXT_MD="${TEXT_MD}- 👤 **Actor:** [${ACTOR}](${ACTOR_URL})${NL}"
        TEXT_MD="${TEXT_MD}- ⚡ **Event:** ${EVENT}${NL}"
        TEXT_MD="${TEXT_MD}- 🔖 **Commit:** [\`${SHORT_SHA}\`](${COMMIT_URL})${NL}"
        TEXT_MD="${TEXT_MD}- 🏃 **Run:** [#${RUN_ID}](${RUN_URL})"
        TEXT_MD="${TEXT_MD}${EXTRA_LINE_MD}"

        write_output "message" "$TEXT_MD"

        # From here on we treat every fallback problem as a soft skip:
        # the caller opted out of Telegram, so failing the job would be
        # more surprising than silently exposing the rendered message.
        skip_fallback() {
          echo "::warning::$1"
          echo "channel=none" >> "$GITHUB_OUTPUT"
          exit 0
        }

        if [ "$EVENT" != "pull_request" ] && [ "$EVENT" != "pull_request_target" ]; then
          skip_fallback "Event is '${EVENT}' — no PR to comment on. Alert body available on the 'message' output."
        fi

        if [ -z "$GH_TOKEN" ]; then
          skip_fallback "github-token is empty; skipping PR-comment fallback. Alert body available on the 'message' output."
        fi

        PR_NUMBER=$(jq -r '.pull_request.number // .number // empty' "$EVENT_PATH")
        if [ -z "$PR_NUMBER" ]; then
          skip_fallback "Could not determine PR number from event payload; skipping PR-comment fallback."
        fi

        BODY_JSON=$(jq -Rn --arg b "$TEXT_MD" '{body: $b}')

        HTTP_CODE=$(curl -sS -o /tmp/tg-alert-resp.json -w '%{http_code}' -X POST \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "${API_URL}/repos/${REPO}/issues/${PR_NUMBER}/comments" \
          --data-binary "$BODY_JSON")

        RESP=$(cat /tmp/tg-alert-resp.json)
        echo "$RESP"

        COMMENT_ID=$(printf '%s' "$RESP" | jq -r '.id // empty')
        if [ -z "$COMMENT_ID" ]; then
          case "$HTTP_CODE" in
            403)
              skip_fallback "GitHub returned 403 posting the PR comment. The caller workflow likely needs 'permissions: pull-requests: write', or this PR is from a fork (fork PRs on pull_request events get a read-only token — switch the caller to pull_request_target with care, or gate the notify step). Alert body available on the 'message' output." ;;
            404)
              skip_fallback "GitHub returned 404 posting the PR comment (repo or PR not found, or token lacks visibility). Alert body available on the 'message' output." ;;
            *)
              skip_fallback "GitHub returned HTTP ${HTTP_CODE} posting the PR comment. Alert body available on the 'message' output." ;;
          esac
        fi

        echo "comment-id=${COMMENT_ID}" >> "$GITHUB_OUTPUT"
        echo "channel=pr-comment" >> "$GITHUB_OUTPUT"
